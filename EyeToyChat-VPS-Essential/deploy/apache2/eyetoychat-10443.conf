# EyeToy Chat public HTTP endpoint
# Apache keeps :80 and :443 unchanged.
# The PS2 connects to the EyeToy service on plain HTTP :10443.
#
# Enable:
#   a2enmod proxy proxy_http
#   a2enconf eyetoychat-10443
#   systemctl reload apache2
#
Listen 10443

<VirtualHost *:10443>
    ServerName vmail.online.scee.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:18080/
    ProxyPassReverse / http://127.0.0.1:18080/

    ErrorLog ${APACHE_LOG_DIR}/eyetoychat_error.log
    CustomLog ${APACHE_LOG_DIR}/eyetoychat_access.log combined
</VirtualHost>
